<div class="chart" [class.chart--coral]="tone() === 'coral'">
  <svg viewBox="0 0 720 220" role="img" [attr.aria-label]="title()">
    <title>{{ title() }}</title>
    <line x1="54" y1="184" x2="690" y2="184" />
    <line x1="54" y1="28" x2="54" y2="184" />
    @for (bar of bars(); track bar.bucket) {
      <rect [attr.x]="bar.x" [attr.y]="bar.y" [attr.width]="bar.width" [attr.height]="bar.height">
        <title>{{ formatBucket(bar.bucket) }} : {{ bar.value }}{{ valueSuffix() }}</title>
      </rect>
    }
    @if (bars().length === 0) {
      <text x="360" y="112" text-anchor="middle">Aucune activité sur cette période</text>
    }
  </svg>

  <details>
    <summary>Voir les données du graphique</summary>
    <table>
      <thead><tr><th>Période</th><th>Valeur</th></tr></thead>
      <tbody>
        @for (point of series(); track point.bucket) {
          <tr><td>{{ formatBucket(point.bucket) }}</td><td>{{ point.value }}{{ valueSuffix() }}</td></tr>
        }
      </tbody>
    </table>
  </details>
</div>
